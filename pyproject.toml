[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nordicread-speech-engine"
version = "0.2.0"
description = "Standalone local Kokoro speech engine with an authenticated HTTPS API"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "kokoro==0.9.4", "misaki[en]==0.9.4", "cryptography==50.0.2", "Flask==3.1.3", "Werkzeug==3.1.9",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"
]

[project.scripts]
nordicread-speech-engine = "nordicread_speech_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
